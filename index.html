<style>

lateY(7px)}to{opacity:1;transform:translateY(0)}}.matchclock{font-size:24px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}.feed p{margin:0 0 8px}.score{font-size:42px;font-weight:900;color:var(--gold);text-align:center}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:9}.modalbox{width:min(560px,100%);background:#111d30;border:1px solid #53647c;border-radius:18px;padding:22px;max-height:90vh;overflow:auto}.toast{position:fixed;bottom:18px;right:18px;background:#203754;border:1px solid var(--gold);padding:12px 18px;border-radius:10px;z-index:20}.small{font-size:12px;color:var(--muted)}

button:active{transform:scale(.96);filter:brightness(1.2)}

function positionFor(team,idx){
 const roster=realRosters[team]||[];
 if(idx>=roster.length){return positions[idx%positions.length]}
 const profile=positionProfiles[team]||[3,11,20];
 const [gk,defEnd,midEnd]=profile;
 if(idx<gk)return 'KL';
 if(idx<defEnd){const n=idx-gk;return ['STP','STP','SLB','SGB','STP','SLB','SGB','STP'][n%8]}
 if(idx<midEnd){const n=idx-defEnd;return ['MO','MO','MO','MO','SĞK','SLK','MO','MO','SĞK','SLK'][n%10]}
 const n=idx-midEnd;return ['SNT','SĞK','SLK','SNT','SNT','SĞK'][n%6];
}

function poissonGoals(lambda){let L=Math.exp(-lambda),k=0,p=1;do{k++;p*=Math.random()}while(p>L&&k<9);return Math.max(0,k-1)}
function tacticalProfile(team){
 const user=team.name===game.user, formation=user?(game.tactics.formation||'4-2-3-1'):'4-3-3', style=user?(game.tactics.style||'Dengeli'):'Dengeli';
 const nums=formation.split('-').map(Number), defenders=nums[0]||4, mids=nums[1]||3, forwards=nums.slice(2).reduce((a,b)=>a+b,0);
 const shapeAttack=Math.max(-.12,Math.min(.12,(forwards-3)*.035+(mids-3)*.012));
 const shapeDefense=Math.max(-.13,Math.min(.13,(defenders-4)*.045));
 const styles={ 'Hücum':{attack:.19,defence:-.14,tempo:.08},'Dengeli':{attack:0,defence:0,tempo:0},'Savunma':{attack:-.15,defence:.20,tempo:-.05},'Kontra atak':{attack:.09,defence:.13,tempo:.04},'Yüksek pres':{attack:.15,defence:-.11,tempo:.12},'Topa sahip olma':{attack:.07,defence:.07,tempo:-.02} };
 return {formation,style,attack:(styles[style]||styles.Dengeli).attack+shapeAttack,defence:(styles[style]||styles.Dengeli).defence+shapeDefense,tempo:(styles[style]||styles.Dengeli).tempo};
}

function matchSim(home,away){
 const hp=tacticalProfile(home),ap=tacticalProfile(away);
 let homeStrength=home.rating+2.8+teamFormBoost(home)+rand(-3,3);
 let awayStrength=away.rating+teamFormBoost(away)+rand(-3,3);
 let diff=homeStrength-awayStrength;
 let homeXG=Math.max(.2,Math.min(3.35,(1.32+diff/18+rand(-2,2)/10)*(1+hp.attack)*(1-ap.defence*.42)*(1+hp.tempo*.35)));
 let awayXG=Math.max(.18,Math.min(3.0,(1.12-diff/19+rand(-2,2)/10)*(1+ap.attack)*(1-hp.defence*.42)*(1+ap.tempo*.35)));
 return [Math.min(6,poissonGoals(homeXG)),Math.min(6,poissonGoals(awayXG))];
}

function completeBuy(id,loan){let p=game.market.find(x=>x.id===id),t=clubObj(game.user);if(!p)return;const currentWage=t.players.reduce((sum,x)=>sum+(Number(x.wage)||0),0),weeklyLimit=Math.max(0,(Number(t.wageBudget)||1.2)*1000000),fee=loan?p.value*.18:p.value;if(game.budget<fee){toast('Bonservis/kiralama bütçesi yetersiz');return}if(currentWage+p.wage>weeklyLimit){toast('Haftalık maaş bütçesi aşılır. Önce maaş yükünü azalt.');return}game.budget-=fee;p.club=game.user;p.years=loan?1:3;p.loaned=!!loan;if(loan)p.loanWeeks=34;else{p.loanWeeks=0;delete p.loanWeeks;}p.listed=false;t.players.push(p);t.rating=Math.round(t.players.reduce((sum,x)=>sum+x.rating,0)/t.players.length);game.market=game.market.filter(x=>x.id!==id);game.news.unshift(`${p.name} kadroya katıldı. Haftalık maaş yükü ${fmt(p.wage)} € arttı.`);save();closeModal();render();toast('Transfer tamamlandı')}

function offerAction(id,action){const o=(game.offers||[]).find(x=>x.id===id);if(!o)return;const t=clubObj(game.user),p=t.players.find(x=>x.id===o.playerId);if(!p){game.offers=game.offers.filter(x=>x.id!==id);save();render();return}
 if(action==='reject'){o.status='Reddedildi';game.news.unshift(`${p.name} için ${o.club} teklifini reddettin.`)}
 else if(action==='accept'){if(o.type==='Bonservis'){game.budget+=o.fee;t.players=t.players.filter(x=>x.id!==p.id);t.rating=Math.round(t.players.reduce((sum,x)=>sum+x.rating,0)/Math.max(1,t.players.length));game.news.unshift(`${p.name}, ${o.club} takımına ${money(o.fee)} bedelle transfer oldu.`)}else{game.budget+=o.fee;p.loaned=true;p.loanWeeks=34;p.listed=false;game.news.unshift(`${p.name}, ${o.club} takımına kiralandı.`)}o.status='Kabul edildi'}
 else if(action==='negotiate'){o.fee=+(o.fee*1.18).toFixed(2);o.status='Revize teklif bekleniyor';toast('Karşı kulübe %18 daha yüksek bedel iletildi')}
 save();render();

function refreshSponsorOffers(){
 if(!game)return;
 game.sponsorOffers=Array.isArray(game.sponsorOffers)?game.sponsorOffers:[];
 game.sponsorOffers=game.sponsorOffers.filter(o=>(!o.expiresWeek||o.expiresWeek>=game.week)&&!game.sponsors.some(x=>x.slot===o.slot));
 if(game.week>34){game.sponsorOffers=[];return;}
 const rank=table().findIndex(t=>t.name===game.user)+1;
 const existing=new Set(game.sponsorOffers.map(o=>o.name));
 const eligible=sponsorCatalog.filter(o=>!existing.has(o.name)&&!game.sponsors.some(x=>x.slot===o.slot)&&game.rep>=Math.max(25,o.rep-18)&&rank<=Math.min(18,o.rank+6));
 const shuffled=[...eligible].sort(()=>Math.random()-.5);
 const slots=Math.max(0,6-game.sponsorOffers.length);
 game.sponsorOffers.push(...shuffled.slice(0,slots).map(o=>({...o,expiresWeek:Math.min(34,game.week+4)})));
}

function sponsor(index){
 const offer=(game.sponsorOffers||[])[index];if(!offer){toast('Bu teklif artık mevcut değil');return}
 const rank=table().findIndex(t=>t.name===game.user)+1;
 if(game.sponsors.some(x=>x.slot===offer.slot)){toast('Bu sponsorluk alanı zaten dolu');return}
 if(game.rep<offer.rep||rank>offer.rank||game.fan<offer.fan){toast('Sponsor şartları henüz karşılanmıyor');return}
 game.sponsors.push({name:offer.name,slot:offer.slot,value:offer.value,goal:offer.goal,rank:offer.rank,rep:offer.rep,fan:offer.fan,paid:offer.value*.25,total:offer.value,signWeek:game.week});
 game.budget+=offer.value*.25;
 game.news.unshift(`${offer.name} ile ${offer.slot} anlaşması imzalandı. İlk ödeme bütçeye aktarıldı.`);
 game.sponsorOffers=(game.sponsorOffers||[]).filter(x=>x.name!==offer.name);
 save();render();toast('Anlaşma imzalandı · sezonluk ödemenin %25’i aktarıldı');
}
function processSponsorPayments(){
 if(!game||game.week%8!==0)return;
 const rank=table().findIndex(t=>t.name===game.user)+1;
 (game.sponsors||[]).forEach(sp=>{
  if(sp.paid===undefined)sp.paid=sp.value*.25;
  const eligible=rank<=Math.min(18,sp.rank||18)&&game.fan>=(sp.fan||0);
  if(eligible&&sp.paid<sp.total){const payment=Math.min(sp.value*.25,sp.total-sp.paid);game.budget+=payment;sp.paid+=payment;game.news.unshift(`${sp.name} performans ödemesi: ${money(payment)}.`)}
 });
 refreshSponsorOffers();
}

function makeLowerTeam(name){
 const base=lowerRatings[name]||61, roster=realRosters[name]||[];
 const players=Array.from({length:Math.max(22,roster.length)},(_,i)=>makePlayer(name,i,base));
 return {name,rating:base,budget:base>=66?18:base>=63?12:8,wageBudget:.65,players,points:0,played:0,w:0,d:0,l:0,gf:0,ga:0};
}
function resetTeamSeason(t){t.points=t.played=t.w=t.d=t.l=t.gf=t.ga=0}
function buildFixtures(teamNames){
 const fs=[],arr=[...teamNames];
 for(let r=0;r<teamNames.length-1;r++){
  for(let i=0;i<teamNames.length/2;i++){
   const a=arr[i],b=arr[arr.length-1-i];
   fs.push({round:r+1,home:r%2?b:a,away:r%2?a:b,played:false});
  }
  arr.splice(1,0,arr.pop());
 }
 const first=[...fs];first.forEach(f=>fs.push({round:f.round+teamNames.length-1,home:f.away,away:f.home,played:false}));
 return fs;
}

function newSeason(){
 if(game.week<=34&&!confirm('Sezon tamamlanmadı. Yine de yeni sezona geçilsin mi?'))return;
 const oldTable=table(),champion=oldTable[0],userRank=oldTable.findIndex(x=>x.name===game.user)+1;
 game.history.push({season:game.season,champion:champion.name,rank:userRank});
 const prize=userRank===1?15:userRank<=3?8:userRank<=5?4:1;game.budget+=prize;
 const relegated=oldTable.slice(-3).map(t=>t.name);
 // Üç yükselen, resmî TFF 1. Lig kulüp havuzundan rastgele seçilir.
 const pool=lowerLeagueTeams.filter(n=>lowerRatings[n]&&realRosters[n]&&realRosters[n].length>=20);
 const promoted=[...pool].sort(()=>Math.random()-.5).slice(0,3);
 const fired=relegated.includes(game.user);
 game.teams=game.teams.filter(t=>!relegated.includes(t.name));
 promoted.forEach(n=>game.teams.push(makeLowerTeam(n)));
 game.season++;game.week=1;
 game.teams.forEach(t=>{resetTeamSeason(t);t.players?.forEach(p=>{p.age++;p.apps=p.goals=p.assists=0;p.injury=0;p.form=7;p.rating=Math.min(p.potential,p.rating+(p.age<25?rand(0,1):p.age>31?rand(-1,0):0));p.years=Math.max(0,p.years-1)})});
 game.fixtures=buildFixtures(game.teams.map(t=>t.name));
 game.sponsors=[];game.sponsorOffers=[];refreshSponsorOffers();
 game.news.unshift(`${game.season}/${game.season+1} sezonu başladı. Şampiyon: ${champion.name}. Küme düşenler: ${relegated.join(', ')}. Yükselenler: ${promoted.join(', ')}.`);
 save();
 if(fired){showJobOffers();return}
 game.news.unshift('Yönetim yeni sezon hedeflerini açıkladı.');
 page='home';render();toast('Yeni sezon başladı · 3 takım yükseldi, 3 takım düştü');
}
